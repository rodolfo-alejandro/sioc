{% extends "layouts/base.html" %}
{% block title %}Importar Llamadas SE - SIOC{% endblock %}
{% block content %}
<div class="page-header">
  <h1><i class="bi bi-cloud-upload"></i> Importar llamadas SE</h1>
  <p class="text-muted">Carga CSV separado por <strong>;</strong>.</p>
</div>

<div class="card">
  <div class="card-body">
    <div class="mb-3"><strong>Total vigente:</strong> {{ total|number_format }}</div>

    <form method="POST" enctype="multipart/form-data" class="row g-2 align-items-end">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="col-md-8">
        <label class="form-label">Archivo CSV</label>
        <input type="file" name="archivo" class="form-control" accept=".csv" required>
      </div>
      <div class="col-md-8">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="als-replace-all" name="replace_all" value="1">
          <label class="form-check-label" for="als-replace-all">Reemplazar todo lo cargado antes de importar.</label>
        </div>
      </div>
      <div class="col-md-4 d-grid">
        <button class="btn btn-success" type="submit"><i class="bi bi-upload"></i> Importar</button>
      </div>
    </form>

    <form method="POST" action="{{ url_for('analisis_llamadas_se.importar_base') }}" class="mt-3">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" id="als-replace-base" name="replace_all" value="1">
        <label class="form-check-label" for="als-replace-base">Reemplazar todo antes de importar archivo base.</label>
      </div>
      <button class="btn btn-outline-primary btn-sm" type="submit">Importar `llamadas_se_2026.csv` del proyecto</button>
    </form>

    <form method="POST" action="{{ url_for('analisis_llamadas_se.limpiar') }}" class="mt-3" onsubmit="return confirm('¿Eliminar todas las llamadas SE cargadas?');">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button class="btn btn-outline-danger btn-sm" type="submit"><i class="bi bi-trash"></i> Eliminar todo lo cargado</button>
    </form>
  </div>
</div>
{% endblock %}
