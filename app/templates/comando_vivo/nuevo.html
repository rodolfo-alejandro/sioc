{% extends "layouts/base.html" %}
{% block title %}Nuevo operativo en vivo - SIOC{% endblock %}
{% block content %}
<div class="page-header">
  <h1><i class="bi bi-plus-circle"></i> Nuevo operativo en vivo</h1>
  <p class="text-muted mb-0">Se genera un código corto para que el personal se una desde el celular.</p>
</div>

<div class="card" style="max-width: 560px;">
  <div class="card-body">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">Nombre *</label>
        <input class="form-control" name="nombre" required maxlength="200"
               placeholder="Ej. Allanamiento B° X — 15/10">
      </div>
      <div class="mb-3">
        <label class="form-label">Tipo</label>
        <select class="form-select" name="tipo">
          <option value="">—</option>
          <option value="allanamiento">Allanamiento</option>
          <option value="procedimiento">Procedimiento</option>
          <option value="patrullaje">Patrullaje</option>
          <option value="prueba">Prueba / piloto</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Notas</label>
        <textarea class="form-control" name="notas" rows="2"></textarea>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Crear y abrir mapa</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('comando_vivo.listado') }}">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
