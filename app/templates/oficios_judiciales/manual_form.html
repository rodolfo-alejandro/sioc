{% extends "layouts/base.html" %}
{% block title %}Nueva Consigna Manual{% endblock %}
{% block content %}
<div class="page-header">
    <h1><i class="bi bi-pencil-square"></i> Nueva Consigna Manual VIF</h1>
</div>

<form method="POST" class="row g-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="col-md-3">
        <label class="form-label">Expediente</label>
        <input class="form-control" name="expediente" required>
    </div>
    <div class="col-md-4">
        <label class="form-label">Juzgado</label>
        <select class="form-select" name="juzgado_id">
            <option value="">Seleccionar...</option>
            {% for j in juzgados %}
            <option value="{{ j.id }}">{{ j.nombre }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-5">
        <label class="form-label">Carátula</label>
        <input class="form-control" name="caratula">
    </div>

    <div class="col-md-4">
        <label class="form-label">Tipo medida</label>
        <select class="form-select" name="tipo_medida_id">
            <option value="">Seleccionar...</option>
            {% for t in tipos_medida %}
            <option value="{{ t.id }}">{{ t.nombre }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-2">
        <label class="form-label">Tipo consigna</label>
        <select class="form-select" name="tipo_consigna">
            {% for tc in tipos_consigna %}
            <option value="{{ tc.nombre|lower }}">{{ tc.nombre }}</option>
            {% endfor %}
            {% if not tipos_consigna %}
            <option value="fija">Fija</option>
            <option value="ambulatoria">Ambulatoria</option>
            <option value="personalizada">Personalizada</option>
            <option value="indeterminada">Indeterminada</option>
            <option value="mixta">Mixta</option>
            {% endif %}
        </select>
    </div>
    <div class="col-md-3">
        <label class="form-label">Fiscalía</label>
        <select class="form-select" name="fiscalia_id">
            <option value="">Seleccionar...</option>
            {% for f in fiscalias %}
            <option value="{{ f.id }}">{{ f.nombre }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-3">
        <label class="form-label">Fiscalía (texto libre)</label>
        <input class="form-control" name="fiscalia_txt" placeholder="Si no está en catálogo">
    </div>
    <div class="col-md-2"><label class="form-label">Fecha oficio</label><input class="form-control" type="date" name="fecha_oficio"></div>
    <div class="col-md-2"><label class="form-label">Fecha notificación</label><input class="form-control" type="date" name="fecha_notificacion"></div>
    <div class="col-md-2">
        <label class="form-label">Estado</label>
        <select class="form-select" name="estado">
            <option value="activa">Activa</option>
            <option value="finalizada">Finalizada</option>
        </select>
    </div>

    <div class="col-md-2"><label class="form-label">Días fija</label><input class="form-control" name="dias_fija"></div>
    <div class="col-md-2"><label class="form-label">Días ambulatoria</label><input class="form-control" name="dias_ambulatoria"></div>
    <div class="col-md-2"><label class="form-label">Días personalizada</label><input class="form-control" name="dias_personalizada"></div>
    <div class="col-md-2"><label class="form-label">Días total</label><input class="form-control" name="cantidad_dias"></div>
    <div class="col-md-3"><label class="form-label">Teléfono contacto</label><input class="form-control" name="telefono_contacto"></div>

    <div class="col-12">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <strong>Personas y domicilios</strong>
                <button class="btn btn-outline-success btn-sm" type="button" id="btn-add-persona">Agregar persona</button>
            </div>
            <div class="card-body">
                <div id="personas-wrap" class="row g-2"></div>
            </div>
        </div>
    </div>

    <div class="col-12 d-flex gap-2">
        <a class="btn btn-outline-secondary" href="{{ url_for('oficios_judiciales.manual_listado') }}">Cancelar</a>
        <button class="btn btn-primary" type="submit">Guardar</button>
    </div>
</form>
{% endblock %}
{% block extra_scripts %}
<script>
(function () {
    var wrap = document.getElementById('personas-wrap');
    var btn = document.getElementById('btn-add-persona');
    if (!wrap || !btn) return;
    function addRow() {
        var idx = wrap.querySelectorAll('.persona-row').length + 1;
        var div = document.createElement('div');
        div.className = 'col-12 persona-row border rounded p-2';
        div.innerHTML = '' +
            '<div class="row g-2">' +
            '<div class="col-md-3"><label class="form-label">Nombre</label><input class="form-control" name="persona_nombre[]"></div>' +
            '<div class="col-md-2"><label class="form-label">DNI</label><input class="form-control" name="persona_dni[]"></div>' +
            '<div class="col-md-2"><label class="form-label">Tipo</label><select class="form-select" name="persona_tipo[]"><option value="victima">Víctima</option><option value="denunciado">Acusado</option></select></div>' +
            '<div class="col-md-2"><label class="form-label">¿Notificar?</label><select class="form-select" name="persona_notificar[]"><option value="si">Sí</option><option value="no">No</option></select></div>' +
            '<div class="col-md-3"><label class="form-label">Domicilio</label><input class="form-control" name="persona_domicilio[]"></div>' +
            '<div class="col-md-3"><label class="form-label">Barrio</label><select class="form-select" name="persona_barrio_id[]"><option value="">Seleccionar...</option>{% for b in barrios %}<option value="{{ b.id }}">{{ b.nombre }}{% if b.codigo %} ({{ b.codigo }}){% endif %}</option>{% endfor %}</select></div>' +
            '<div class="col-md-2"><label class="form-label">Latitud</label><input class="form-control" name="persona_lat[]" placeholder="-24.78"></div>' +
            '<div class="col-md-2"><label class="form-label">Longitud</label><input class="form-control" name="persona_lng[]" placeholder="-65.41"></div>' +
            '<div class="col-md-2 d-flex align-items-end"><button class="btn btn-outline-danger w-100 btn-sm js-del" type="button">Quitar</button></div>' +
            '</div>';
        div.querySelector('.js-del').addEventListener('click', function () { div.remove(); });
        wrap.appendChild(div);
    }
    btn.addEventListener('click', addRow);
    addRow();
})();
</script>
{% endblock %}
